name: Verify GPT-6.1 ARC release

on:
  push:
    branches: [master]
    paths:
      - arc/crack_lab/releases/arc_agi3_gkm_v3_182/**
      - arc/campaign_costs.py
      - arc/test_campaign_costs.py
      - arc/crack_lab/replay_scorecard.py
      - arc/crack_lab/test_partial_scorecard.py
      - .github/workflows/gpt61-release.yml
  pull_request:
    paths:
      - arc/crack_lab/releases/arc_agi3_gkm_v3_182/**
      - arc/campaign_costs.py
      - arc/test_campaign_costs.py
      - arc/crack_lab/replay_scorecard.py
      - arc/crack_lab/test_partial_scorecard.py
      - .github/workflows/gpt61-release.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test token accounting and scorecard validation
        run: PYTHONPATH=arc:arc/crack_lab python -m pytest -q arc/test_campaign_costs.py arc/crack_lab/test_partial_scorecard.py arc/crack_lab/test_replay_scorecard.py
      - name: Verify published release and producer hashes
        run: |
          python - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('arc/crack_lab/releases/arc_agi3_gkm_v3_182')
          listed = {}
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name not in listed
              listed[name] = digest
          actual = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS.txt'}
          assert actual == listed, 'release file inventory or digest mismatch'
          producer = root / 'producer_source'
          expected = json.loads((producer / 'source_manifest.json').read_text())['files_sha256']
          found = {p.relative_to(producer).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in producer.rglob('*') if p.is_file() and p.name != 'source_manifest.json'}
          assert found == expected, 'acquisition-time source closure mismatch'
          print('Release and acquisition-time source digests reproduce.')
          PYCODE
      - name: Verify the frozen 182-level receipt
        run: >-
          python arc/crack_lab/verify_frozen_release.py
          --canonical-root arc/crack_lab/releases/arc_agi3_gkm_v3_182/artifacts
          --receipt arc/crack_lab/releases/arc_agi3_gkm_v3_182/receipts/*.json
      - name: Recompute token and cost totals from the published ledger
        run: |
          PYTHONPATH=arc python - <<'PY'
          import json
          from pathlib import Path
          from campaign_costs import build_report
          p = Path('arc/crack_lab/releases/arc_agi3_gkm_v3_182/accounting')
          stored = json.loads((p / 'token_costs.json').read_text())
          actual = build_report((p / 'usage.jsonl').read_bytes(),
                                stored['cutoff']['thread_id'],
                                json.loads((p / 'capture_usage.json').read_text()))
          assert actual == stored, 'published token/cost totals do not reproduce'
          print('Published token totals and pricing scenarios reproduce exactly.')
          PY
