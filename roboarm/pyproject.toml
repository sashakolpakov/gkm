[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gkm-roboarm"
version = "0.0.1"
description = "Standalone ARC-style RoboArm experimental environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.4",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboarm_game = ["README.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
cache_dir = "artifacts/pytest-cache"
